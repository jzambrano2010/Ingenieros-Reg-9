<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f1ec;--cd:#fff;--tx:#1b1f23;--mu:#5d6670;--bd:#d6d2c8;--ac:#1d4e89;--a2:#e6eef8;--ok:#0f6b4f;--o2:#e3f3ec;--sk:#e4f1fb;--skb:#a9cfe9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15181b;--cd:#1e2226;--tx:#e8eaed;--mu:#9ba4ad;--bd:#363c43;--ac:#7fb0ea;--a2:#1b2a3c;--ok:#4cc29a;--o2:#173029;--sk:#1a2c3d;--skb:#355a7a;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:84px}
h1{font:600 20px Georgia,"Times New Roman",serif;margin:0}header{padding:14px 16px 6px;max-width:980px;margin:auto}header small{color:var(--mu)}
nav{display:flex;gap:4px;overflow-x:auto;padding:6px 16px;max-width:980px;margin:auto;border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:8px 13px;border-radius:6px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:980px;margin:auto;padding:12px 16px}.panel{display:none}.panel.on{display:block}
details{background:var(--sk);border:1px solid var(--skb);border-radius:12px;margin:0 0 10px}
summary{cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;font-weight:600;list-style:none}
summary::before{content:"";width:9px;height:9px;border-right:2.5px solid var(--ac);border-bottom:2.5px solid var(--ac);transform:rotate(-45deg);transition:transform .15s;margin:7px 8px 0 2px;flex:none}
details[open]>summary::before{transform:rotate(45deg)}summary span{flex:1}summary b{color:var(--ok);font-variant-numeric:tabular-nums}
.bd{padding:2px 14px 14px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mu);gap:3px}
label.ck{flex-direction:row;align-items:center;gap:7px;font-size:13.5px;color:var(--tx)}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:7px 8px;min-width:0}
input[type=checkbox]{width:17px;height:17px}.card{border:1px solid var(--bd);border-radius:7px;padding:10px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.x,.add{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:5px;padding:5px 10px;cursor:pointer;font:inherit}.add{margin-top:6px;color:var(--ac);border-color:var(--ac)}
.out{margin-top:8px;font-size:13px;background:var(--cd);border-radius:5px;padding:7px 10px}.out div{display:flex;justify-content:space-between;gap:8px}.out i{font-style:normal;font-variant-numeric:tabular-nums}
.nt{font-size:12.5px;color:var(--mu);margin:6px 0}
.task:not(.isP) .fp,.task.isP .fr,.ing:not(.isI) .fi,.ing.isI .fm,.hid{display:none}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--ok);color:#fff;padding:9px 16px calc(9px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 18px;font-size:13px}#bar b{font-size:17px}
.tot{background:var(--o2);border:2px solid var(--ok);border-radius:8px;padding:12px 14px;margin-top:10px;font-weight:700;display:flex;justify-content:space-between;font-size:18px}
table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid var(--bd)}td:last-child{text-align:right;font-variant-numeric:tabular-nums}
#phead{display:none}
#rep{display:none;font-size:var(--fs,11pt);line-height:1.3;color:#000;background:#fff;font-family:"Segoe UI",Arial,sans-serif}#rep.meas{display:block;position:absolute;left:-9999px;top:0;width:190mm;visibility:hidden}
#rep h3{font-size:1.05em;margin:.7em 0 .25em;border-bottom:1px solid #000}#rep .rh{border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:4px}#rep .cols{columns:2;column-gap:6mm}#rep .ln,#rep .out div{display:flex;justify-content:space-between;gap:8px;break-inside:avoid}#rep .out{background:none;padding:0;margin:2px 0;font-size:1em}#rep .out i{font-style:normal}#rep .sb{font-weight:700;text-align:right;margin-top:3px}
.act{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}.pri{background:var(--ok);color:#fff;border:0;border-radius:6px;padding:9px 18px;font-weight:600;font-size:15px;cursor:pointer}#bar .pri{background:#fff;color:#000;padding:6px 12px}
.tt{flex-direction:column;gap:4px;font-size:15px;font-weight:600}
body:not(.shown) .out,body:not(.shown) summary b,body:not(.shown) #bar,body:not(.shown) .tot,body:not(.shown) #rs{display:none}body.stale #bar{background:#b45309}
#lic{display:none}#lic.bad{display:block;background:#b3261e;color:#fff;padding:9px 16px;text-align:center;font-size:14px}#lic button{margin-left:8px;border:0;border-radius:5px;padding:5px 10px;cursor:pointer}
#mod{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;align-items:center;justify-content:center;padding:16px}#mod .mb{background:var(--cd);color:var(--tx);border-radius:12px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:16px}#mod h4{margin:12px 0 4px;color:var(--ac)}#mod td:nth-child(2){text-align:center;color:var(--mu)}
.lk{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}.lk a,.wa{display:block;padding:10px 12px;border:1px solid var(--skb);background:var(--cd);color:var(--ac);border-radius:8px;text-decoration:none;font-weight:600}.wa{display:inline-block}
nav button.hd{display:none}body.mod nav button.hd{display:inline-block}
